name: Build and publish dashboard

on:
  schedule:
    - cron: "17 * * * *"      # hourly; does nothing unless an event is running (see collect.py --check-active)
  workflow_dispatch:           # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Is an event running?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(python collector/collect.py --check-active)" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect data
        if: steps.gate.outputs.run == 'true'
        env:
          DASHBOARD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector/collect.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
